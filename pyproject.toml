[project]
name = "rag-lab"
version = "0.1.0"
description = "사내 문서 RAG용 문서 처리 모듈"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# PDF 파서(LiteParse). 필요할 때만 `uv sync --extra liteparse`로 설치한다.
liteparse = ["liteparse>=2.19.0"]

[project.scripts]
rag-lab-parser = "rag_lab.parser.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
